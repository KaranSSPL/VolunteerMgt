<div class="volunteer-container">
    <h2 *ngIf="!isEditing">Volunteers List</h2>
    <div class="table-container" *ngIf="!isEditing">
      <div class="search-wrapper">
        <div class="search-container">
          <i class="material-icons search-icon">search</i>
          <input type="text" placeholder="Search..." class="search-input" [(ngModel)]="searchText" />
        </div>
      <button class="create-btn" routerLink="/createVolunteer">Add Volunteer</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Mobile No</th>
            <th>Address</th>
            <th>Occupation</th>
            <th>Availability</th>
            <th>Code</th>
            <th>Image</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let volunteer of filteredVolunteers">
            <td>{{ volunteer.name }}</td>
            <td>{{ volunteer.mobileNo }}</td>
            <td>{{ volunteer.address }}</td>
            <td>{{ volunteer.occupation }}</td>
            <td>
              <ul>
                <li *ngFor="let avail of volunteer.availabilities">
                  {{ avail.day }} - {{ avail.timeSlot }}
                </li>
              </ul>
            </td>
            <td>{{ volunteer.code }}</td>
            <td>
              <img [src]="volunteer.imagePath" alt="Volunteer Image" width="50" height="50" *ngIf="volunteer.imagePath">
            </td>
            <td>
              <button class="btn-edit" (click)="editVolunteer(volunteer)">Edit</button>
              <button class="btn-delete" (click)="deleteVolunteer(volunteer.id)">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  <app-edit-volunteer *ngIf="isEditing"
                      [volunteer]="selectedVolunteer"
                      (cancelEdit)="cancelEdit()">
  </app-edit-volunteer>

</div>
