<div class="edit-container" *ngIf="form">
  <h2>Edit Volunteer-Service Mapping</h2>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Volunteer Name :</label>
      <div class="form-block">
        <input type="text" formControlName="volunteerName" />
      </div>
    </div>
    <div class="form-group">
      <label>Service Name :</label>
      <div class="form-block">
        <input type="text" formControlName="serviceName" />
      </div>
    </div>
    <div class="form-group">
      <label>Time Slot :</label>
      <div class="form-block">
        <input type="datetime-local" formControlName="timeSlot" />
      </div>
    </div>
    <div class="form-group">
      <label>Exit Time :</label>
      <div class="form-block">
        <input type="text" formControlName="exitTime" />
      </div>
    </div>
    <div class="form-group">
      <label>Batch Number :</label>
      <div class="form-block">
        <input type="number" formControlName="batchNumber" />
      </div>
    </div>
    <div class="form-group">
      <label>Coupon :</label>
      <div class="form-block">
        <input type="number" formControlName="coupon" />
      </div>
    </div>
    <button class="update" type="submit">Update</button>
    <button class="cancel"type="submit" (click)="cancel()">Cancel</button>
  </form>
</div>
