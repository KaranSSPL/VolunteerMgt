<section class="container">
  <div class="login-container">
    <div class="circle circle-one"></div>
    <div class="form-container">
      <img src="https://raw.githubusercontent.com/hicodersofficial/glassmorphism-login-form/master/assets/illustration.png"
           alt="illustration" class="illustration" />
      <h1 class="opacity">SIGN UP</h1>
      <form #form="ngForm" (ngSubmit)="registerUser(form)" novalidate>
        <input type="text"
               [(ngModel)]="user.firstname"
               name="firstname"
               placeholder="First Name"
               required
               #firstname="ngModel" />
        <div *ngIf="(firstname.dirty || form.submitted) && firstname.invalid" class="error-msg">
          First Name is required.
        </div>

        <input type="text"
               [(ngModel)]="user.lastname"
               name="lastname"
               placeholder="Last Name"
               required
               #lastname="ngModel" />
        <div *ngIf="(lastname.dirty || form.submitted) && lastname.invalid" class="error-msg">
          Last Name is required.
        </div>

        <input type="email"
               [(ngModel)]="user.email"
               name="email"
               placeholder="Email"
               required
               pattern="^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[a-zA-Z]{3,}$"
               #email="ngModel" />
        <div *ngIf="(email.dirty || form.submitted) && email.errors?.['required']" class="error-msg">
          Email is required.
        </div>
        <div *ngIf="(email.dirty || form.submitted) && email.errors?.['pattern']" class="error-msg">
          Enter a valid email (e.g., user&#64;example.com).
        </div>

        <input type="text"
               [(ngModel)]="user.username"
               name="username"
               placeholder="Username"
               required
               #username="ngModel" />
        <div *ngIf="(username.dirty || form.submitted) && username.invalid" class="error-msg">
          Username is required.
        </div>

        <input type="text"
               [(ngModel)]="user.phone"
               name="phone"
               placeholder="Phone Number"
               required
               pattern="^[0-9]{10,}$"
               #phone="ngModel" />
        <div *ngIf="(phone.dirty || form.submitted) && phone.errors?.['required']" class="error-msg">
          Phone number is required.
        </div>
        <div *ngIf="(phone.dirty || form.submitted) && phone.errors?.['pattern']" class="error-msg">
          Enter a valid phone number (10+ digits).
        </div>

        <input type="password"
               [(ngModel)]="user.password"
               name="password"
               placeholder="Password"
               required
               #password="ngModel" />
        <div *ngIf="(password.dirty || form.submitted) && password.invalid" class="error-msg">
          Password is required.
        </div>

        <button class="opacity" type="submit">Sign Up</button>
      </form>


      <div class="register-forget opacity">
        <p>Already have an account? <a class="login" routerLink="/login">Login</a></p>
      </div>
    </div>
    <div class="circle circle-two"></div>
  </div>
  <div class="theme-btn-container"></div>
</section>
